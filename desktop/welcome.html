<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎使用云记事板</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(160deg, #eff6ff 0%, #ffffff 100%);
  color: #1f2937;
  overflow:hidden;
}
#root {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  padding: 32px;
}
.card {
  width: 460px;
  max-width: 100%;
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(59,130,246,0.12), 0 4px 12px rgba(0,0,0,0.06);
  padding: 36px;
  text-align: center;
}
.logo {
  width: 64px; height: 64px;
  margin: 0 auto 16px;
  background: #3b82f6;
  border-radius: 18px;
  display:flex; align-items:center; justify-content:center;
  color: #fff; font-size: 28px;
  box-shadow: 0 8px 20px rgba(59,130,246,0.25);
}
h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #111827; }
.subtitle { font-size: 14px; color: #6b7280; margin-bottom: 28px; line-height: 1.5; }
.steps {
  text-align: left;
  background: #f8fafc;
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 24px;
  font-size: 13px;
  color: #4b5563;
  line-height: 1.7;
}
.steps strong { color: #1f2937; }
.actions { display:flex; flex-direction:column; gap: 12px; }
.btn {
  width:100%; padding: 13px 16px; border-radius: 12px; border:none;
  font-size: 14px; font-weight: 600; cursor:pointer; transition:.15s;
  display:flex; align-items:center; justify-content:center; gap: 8px;
}
.btn-primary { background: #3b82f6; color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.22); }
.btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
.btn-secondary { background: #f1f5f9; color: #334155; }
.btn-secondary:hover { background: #e2e8f0; }
.btn-ghost { background: transparent; color: #6b7280; font-weight: 500; }
.btn-ghost:hover { color: #374151; }
.hint {
  margin-top: 18px;
  font-size: 12px; color: #9ca3af;
  line-height: 1.5;
}
.status {
  display:none;
  margin-top: 16px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  background: #ecfdf5;
  color: #047857;
}
.status.error { background: #fef2f2; color: #b91c1c; }
</style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="logo">☁</div>
    <h1>欢迎使用云记事板桌面版</h1>
    <p class="subtitle">透明置顶悬浮窗，便利贴、待办、日程随时看</p>

    <div class="steps">
      <strong>如果你之前在浏览器里记过内容：</strong><br>
      1. 点击下方「打开浏览器导出」按钮<br>
      2. 在网页里点击「导出迁移文件」<br>
      3. 回到这里，桌面版会自动发现新文件并导入<br><br>
      <strong>如果你已经有迁移文件：</strong>直接点「选择文件导入」即可。
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="openBrowserBtn">1. 打开浏览器导出数据</button>
      <button class="btn btn-secondary" id="importFileBtn">2. 选择迁移文件导入</button>
      <button class="btn btn-ghost" id="skipBtn">还没数据，先随便试试</button>
    </div>

    <div class="status" id="status"></div>
    <p class="hint">提示：下载后的迁移文件 <code>cloudworkbench_backup.json</code> 通常会自动被桌面版找到，无需手动选择。</p>
  </div>
</div>
<script>
const api = window.__desktopWelcome;
const statusEl = document.getElementById('status');

function showStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (isError ? ' error' : '');
  statusEl.style.display = 'block';
}

document.getElementById('openBrowserBtn').addEventListener('click', () => {
  api.openBrowser('https://intp41455.github.io/notebook/');
  showStatus('已打开浏览器。导出迁移文件后，回到本窗口点「选择文件导入」或直接重启桌面版即可自动导入。');
});

document.getElementById('importFileBtn').addEventListener('click', async () => {
  showStatus('正在选择文件…');
  const result = await api.importFile();
  if (result && result.ok) {
    showStatus('导入成功！正在进入主界面…');
    setTimeout(() => api.finish(), 600);
  } else if (result && result.cancelled) {
    statusEl.style.display = 'none';
  } else {
    showStatus('导入失败，请确认选择的是 cloudworkbench_backup.json 文件。', true);
  }
});

document.getElementById('skipBtn').addEventListener('click', () => {
  api.finish();
});
</script>
</body>
</html>
